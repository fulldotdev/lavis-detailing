# -----------------------------------------------
# CARDS 
# -----------------------------------------------
features:
  card: &card
    frame: panel
    look: surface
    hue:
    scheme:
  image: &image
    position:
    ratio:
  buttons: &buttons
    importance:
    layout: 

offers:
  card: *card
  buttons: *buttons

categories: &collection_card
  card: *card
  image: *image

persons: *collection_card
posts: *collection_card
products: *collection_card
reviews: *collection_card
services: *collection_card

# -----------------------------------------------
# INPUTS
# -----------------------------------------------
_inputs:
  frame:
    type: choice
    options:
      values:
        - panel
  look:
    type: choice
    options:
      values:
        - surface
        - soft
        - outline
        - ghost
  image.position:
    type: choice
    options:
      values:
        - relative
        - background
  image.ratio:
    type: choice
    options:
      values:
        - landscape
        - square
        - portrait
  buttons.importance:
    type: choice
    options:
      values:
        - primary
        - secondary
        - tertiary
  buttons.layout:
    type: choice
    options:
      values:
        - row
        - col