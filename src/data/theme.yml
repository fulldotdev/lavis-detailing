theme:
  colors:
    base: slate
    brand: blue
    accent: red
    scheme: dark
    texture: solid
    contrast: false
  fonts:
    heading:
      family: Inter
      weight: 700
      class: 
    subheading:
      family: Inter
      weight: 500
      class: 
    text:
      family: Inter
      weight: 400
      class: 
    button:
      family: Inter 
      weight: 500
      class: 
  sizes:
    scale: 1
    rounded: small

# -----------------------------------------------
# Inputs configuration
# -----------------------------------------------

_inputs:
