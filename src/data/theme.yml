    options:
      values:
        - tomato 
        - red
        - ruby
        - crimson
        - pink
        - plum
        - purple
        - violet
        - iris
        - indigo
        - blue
        - cyan
        - teal
        - jade
        - green
        - grass
        - bronze
        - gold
        - brown
        - orange
        - amber
        - yellow
        - lime
        - mint
        - sky
  colors.accent: *brand