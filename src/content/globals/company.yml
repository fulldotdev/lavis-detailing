_schema: company
company: Lavis Detailing
description: >-
  Lavis Detailing is opgericht door Arjen Visser en is ontstaan door een uit de
  hand gelopen hobby. ”Ik poetste graag mijn eigen auto, daarna die voor mijn
  vrienden en vervolgens had ik het idee dat ik van mijn hobby mijn werk moest
  maken!” Lavis Detailing gaat graag een paar stappen verder. Wij genieten ervan
  om auto’s weer in nieuwstaat te brengen, zodat de klant weer lang van
  zijn/haar auto kan genieten! Lavis Detailing staat bekend om kwaliteit,
  perfectionisme, eerlijkheid en service. Wij houden van een goed glimmende auto
  en een heerlijk schoon interieur.
