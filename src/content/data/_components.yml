# -----------------------------------------------
# Inputs configuration
# -----------------------------------------------
_inputs:
  hue:
    type: choice
    options:
      values:
        - none
        - base
        - brand
        - accent
  scheme:
    type: choice
    options:
      values:
        - none 
        - light
        - dark
  size:
    type: choice
    options:
      values:
        - none 
        - small
        - medium
        - large
  look:
    type: choice
    options:
      values:
        - solid
        - surface
        - soft
        - outline
        - ghost
  frame:
    type: choice
    options:
      values:
        - fill
        - float
        - panel
        - screen
