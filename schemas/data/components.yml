# -----------------------------------------------
# GLOBALS
# -----------------------------------------------
globals: 
  footer: 
    footer: 
      frame: 
      look:
      size:
      hue:
      scheme:
    list: *list
    link: *link
    group: *group
    button: *button
    channel: *channel

  header: 
    header: 
      frame: 
      look:
      size:
      hue:
      scheme:
    logo: *logo
    list: *list
    link: *link
    group: *group
    button: *button

  cta: *cta

# -----------------------------------------------
# Inputs configuration
# -----------------------------------------------
_inputs:
  layout:
      type: choice
      options:
        values:
          - row
          - col
          - grid
          - masonry
          - carousel
  hue:
    type: choice
    options:
      values:
        - base
        - brand
        - accent
  scheme:
    type: choice
    options:
      values:
        - light
        - dark
  size:
    type: choice
    options:
      values:
        - small
        - medium
        - large
  look:
    type: choice
    options:
      values:
        - solid
        - surface
        - soft
        - outline
        - ghost
  frame:
    type: choice
    options:
      values:
        - fill
        - float
        - panel
        - screen
  order:
    type: choice
    options:
      values:
        - normal
        - reverse
        - switch
  x:
    type: choice
    options:
      values:
        - start
        - center
        - end
        - between
  y:
    type: choice
    options:
      values:
        - start
        - center
        - end
  image.position:
    type: choice
    options:
      values:
        - relative
        - background
        - cover
