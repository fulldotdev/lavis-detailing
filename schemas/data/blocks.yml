# -----------------------------------------------
# BLOCKS INPUT SETTINGS
# -----------------------------------------------

# PRESET OPTIONS
_inputs:
  section.x:
    type: choice
    options:
      values:
        - stretch
        - center
  section.y:
    type: choice
    options:
      values:
        - start
        - center
        - end
  frame:
    type: choice
    options:
      values:
        - fill
        - float
        - panel
        - screen
  look:
    type: choice
    options:
      values:
        - ghost
        - outline
        - soft
        - surface
        - solid
  segment.x:
    type: choice
    options:
      values:
        - start
        - center
        - between
  segment.y:
    type: choice
    options:
      values:
        - start
        - center
        - end
  layout:
    type: choice
    options:
      values:
        - carousel
        - grid
        - masonry

