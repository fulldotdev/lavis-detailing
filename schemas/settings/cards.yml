# -----------------------------------------------
# INPUT SETTINGS 
# -----------------------------------------------
_inputs:
  frame:
    type: choice
    options:
      values:
        - panel
        - fill
  look:
    type: choice
    options:
      values:
        - surface
        - soft
        - outline
        - ghost
  buttons.importance:
    type: multiselect
    options:
      values:
        - primary
        - secondary
        - tertiary