# -----------------------------------------------
# CARDS 
# -----------------------------------------------

features:
  card: &card
    frame:
    look:
    hue:
    scheme:
    class:
  image: &image
    position:
    orientation:
    class:
  segment: &segment
    class:
  writeup: &writeup
  buttons: &buttons
    importance:
    class:

offers:
  card: *card
  segment: *segment
  writeup: *writeup
  buttons: *buttons

brands: &collection_card
  card: *card
  image: *image
  segment: *segment
  writeup: *writeup

categories: *collection_card
employees: *collection_card
posts: *collection_card
products: *collection_card
