# PRESET OPTIONS
_inputs:
  frame:
    type: choice
    options:
      values:
        - fill
        - float
        - panel
  look:
    type: choice
    options:
      values:
        - ghost
        - outline
        - soft
        - surface
        - solid
  section.x:
