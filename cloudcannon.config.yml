paths:
  data: src/data
  static: public
  uploads: public/uploads

# -----------------------------------------------
# Cloudcannn sidebar configuration
# -----------------------------------------------

collection_groups:
  - heading: Pagina's
    collections:
      - pages
      - services
      - posts
      - policies
  - heading: Producten
    collections:
      - products
      - categories
      - brands
  - heading: Data
    collections:
      - reviews
      - employees
      - forms
      - data

# -----------------------------------------------
# Collection configuration
# -----------------------------------------------

collections_config:

  pages:
    path: src/content/pages
    url: /[full_slug]/
    output: true
    icon: wysiwyg
    disable_add_folder: true
    _enabled_editors:
      - visual
    schemas: 
      default: 
        path: src/content/pages/_pages.md

  services:
    path: src/content/services
    url: /diensten/[full_slug]/
    output: true
    icon: home_repair_service
    disable_add_folder: true
    _enabled_editors:
      - visual
    schemas: 
      default: 
        path: src/content/services/_services.md

  products:
    path: src/content/products
    url: /producten/[full_slug]/
    output: true
    icon: shopping_cart
    disable_add_folder: true
    _enabled_editors:
      - data
    schemas: 
      default: 
        path: src/content/products/_products.md

  categories:
    path: src/content/categories
    url: /categorieen/[full_slug]/
    output: true
    icon: category
    disable_add_folder: true
    _enabled_editors:
      - data
    schemas: 
      default: 
        path: src/content/categories/_categories.md
        
  brands:
    path: src/content/brands
    url: /merken/[full_slug]/
    output: true
    icon: shape_line
    disable_add_folder: true
    _enabled_editors:
      - data
    schemas: 
      default: 
        path: src/content/brands/_brands.md

  posts:
    path: src/content/posts
    url: /posts/[full_slug]/
    output: true
    icon: edit_document
    disable_add_folder: true
    _enabled_editors:
      - content
    schemas: 
      default: 
        path: src/content/posts/_posts.md

  policies:
    path: src/content/policies
    url: /beleid/[full_slug]/
    output: true
    icon: policy
    disable_add_folder: true
    _enabled_editors:
      - content
    schemas: 
      default: 
        path: src/content/policies/_policies.md
        
  data:
    path: src/content/data
    output: false
    icon: 
    disable_add_folder: true
    disable_add: true
    disable_file_actions: true
    schemas: 
      theme: 
        path: src/content/data/_theme.yml
      components: 
        path: src/content/data/_components.yml
      company: 
        path: src/content/data/_company.yml

  reviews:
    path: src/content/reviews
    output: false
    icon: reviews
    disable_add_folder: true
    _enabled_editors:
      - data
    schemas: 
      default: 
        path: src/content/reviews/_reviews.md
        
  employees:
    path: src/content/employees
    output: false
    icon: diversity_3
    disable_add_folder: true
    _enabled_editors:
      - data
    schemas: 
      default: 
        path: src/content/employees/_employees.md

  forms:
    path: src/content/forms
    output: false
    icon: dynamic_form
    disable_add_folder: true
    _enabled_editors:
      - data
    schemas: 
      default: 
        path: src/content/forms/_forms.md
        
# -----------------------------------------------
# Input customization
# -----------------------------------------------

_inputs:
  seo:
    label: SEO
    comment: Search engine optimization

  seo.title:
    label: Meta title
    comment: Aim for 50-60 characters

  seo.description:
    label: Meta description
    comment: Aim for 50-120 characters

  seo.image:
    label: Page image
    comment: Displayed when sharing a link to this page

  seo.noindex:
    label: Noindex
    comment: Prevent search engines from indexing this page

  seo.canonical:
    label: Canonical URL
    comment: The preferred URL for this page, meaning the url search engines will index, instead of the current one

  image.src:
    type: image
    label: Upload
    correct_orientation: false

  image.alt:
    label: Description

  src:
    type: image
    label: Upload
    correct_orientation: false

  alt:
    label: Description

  href:
    type: url
    label: Link

  writeup:
    type: html

  prose:
    type: html