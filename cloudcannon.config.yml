paths:
  data: src/data
  static: public
  uploads: public/uploads

# -----------------------------------------------
# Cloudcannn sidebar configuration
# -----------------------------------------------

collection_groups:
  - heading: Content
    collections:
      - pages
      - services
      - posts
      - products
      - categories
  - heading: Data
    collections:
      - reviews
      - persons
      - forms
      - policies
      - globals
  - heading: Config
    collections:
      - settings
      - blocks

# -----------------------------------------------
# Collection configuration
# -----------------------------------------------

collections_config:

  pages:
    path: src/content/pages
    url: /[full_slug]/
    output: true
    icon: wysiwyg
    disable_add_folder: true
    _enabled_editors:
      - visual
    schemas: 
      default: 
        path: schemas/pages.md

  services:
    path: src/content/services
    url: /diensten/[full_slug]/
    output: true
    icon: home_repair_service
    disable_add_folder: true
    _enabled_editors:
      - visual
    schemas: 
      default: 
        path: schemas/services.md

  products:
    path: src/content/products
    url: /producten/[full_slug]/
    output: true
    icon: shopping_cart
    disable_add_folder: true
    _enabled_editors:
      - content
      - data
    schemas: 
      default: 
        path: schemas/products.md

  categories:
    path: src/content/categories
    url: /categorieen/[full_slug]/
    output: true
    icon: category
    disable_add_folder: true
    _enabled_editors:
      - data
    schemas: 
      default: 
        path: schemas/categories.md
        
  posts:
    path: src/content/posts
    url: /posts/[full_slug]/
    output: true
    icon: edit_document
    disable_add_folder: true
    _enabled_editors:
      - content
    schemas: 
      default: 
        path: schemas/posts.md

  policies:
    path: src/content/policies
    url: /beleid/[full_slug]/
    output: true
    icon: policy
    disable_add_folder: true
    _enabled_editors:
      - content
    schemas: 
      default: 
        path: schemas/policies.md

  reviews:
    path: src/content/reviews
    output: false
    icon: reviews
    disable_add_folder: true
    _enabled_editors:
      - data
    schemas: 
      default: 
        path: schemas/reviews.md
        
  persons:
    path: src/content/persons
    output: false
    icon: diversity_3
    disable_add_folder: true
    _enabled_editors:
      - data
    schemas: 
      default: 
        path: schemas/persons.md

  forms:
    path: src/content/forms
    output: false
    icon: dynamic_form
    disable_add_folder: true
    _enabled_editors:
      - data
    schemas: 
      default: 
        path: schemas/forms.md

  globals:
    path: src/content/globals
    output: false
    icon: 
    # disable_add_folder: true
    # disable_add: true
    # disable_file_actions: true
    schemas:
      company: 
        path: schemas/globals/company.yml
      header: 
        path: schemas/globals/header.yml
      cta: 
        path: schemas/globals/cta.yml
      footer: 
        path: schemas/globals/footer.yml

  settings:
    path: src/content/settings
    output: false
    icon: 
    # disable_add_folder: true
    # disable_add: true
    # disable_file_actions: true
    schemas:
      theme: 
        path: schemas/settings/theme.yml
      elements: 
        path: schemas/settings/elements.yml
      cards: 
        path: schemas/settings/cards.yml
      blocks: 
        path: schemas/settings/blocks.yml
      globals: 
        path: schemas/settings/globals.yml
      collections: 
        path: schemas/settings/collections.yml

  blocks:
    path: src/components/blocks
    output: false
    schemas:
      custom: 
        path: schemas/blocks/custom.bookshop.yml
        
# -----------------------------------------------
# Input customization
# -----------------------------------------------

_inputs:
  seo:
    label: SEO
    comment: Search engine optimization

  seo.title:
    label: Meta title
    comment: Aim for 50-60 characters

  seo.description:
    label: Meta description
    comment: Aim for 50-120 characters

  seo.image:
    label: Page image
    comment: Displayed when sharing a link to this page

  seo.noindex:
    label: Noindex
    comment: Prevent search engines from indexing this page

  seo.canonical:
    label: Canonical URL
    comment: The preferred URL for this page, meaning the url search engines will index, instead of the current one

  image.src:
    type: image
    label: Upload
    correct_orientation: false

  image.alt:
    label: Description

  src:
    type: image
    label: Upload
    correct_orientation: false

  alt:
    label: Description

  href:
    type: url
    label: Link

  writeup:
    type: html

  prose:
    type: html

# -----------------------------------------------
# Design inputs
# -----------------------------------------------

  hue:
    type: choice
    options:
      values:
        - base
        - brand
        - accent
  scheme:
    type: choice
    options:
      values:
        - light
        - dark
  size:
    type: choice
    options:
      values:
        - small
        - medium
        - large
  layout:
    type: choice
    options:
      values:
        - col
        - row
  order:
    type: choice
    options:
      values:
        - switch
        - reverse
  image.position:
    type: choice
    options:
      values:
        - relative
        - background
        - cover
  image.orientation:
    type: choice
    options:
      values:
        - square
        - landscape
        - portrait
  class:
    type: textarea

# -----------------------------------------------
# Blocks collection inputs
# -----------------------------------------------

  blueprint:
    type: object
    options:
      subtype: mutable